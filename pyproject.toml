[project]
name = "echosign"
version = "1.0.0"
description = "EchoSign - Wearable Gesture-to-Speech AI System"
requires-python = ">=3.9"
dependencies = [
    "flask>=3.0.0",
    "numpy>=1.24.0",
    "gunicorn>=21.2.0",
]

[tool.vercel]
# Explicitly tell Vercel where the Flask app is located
entrypoint = "app:app"

[tool.vercel.scripts]
# Optional: Add build scripts if needed
# build = "python build.py"
